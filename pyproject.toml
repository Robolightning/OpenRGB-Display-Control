[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openrgb-display-control"
version = "0.1.0a1"
description = "Image and animation control for ASUS AniMe Matrix and Corsair ELITE LCD"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "third_party_licenses/*.txt"]
dependencies = ["Pillow>=12,<14", "hidapi>=0.15,<0.16", "openrgb-python==0.3.8"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.8,<7"]
usb = ["pyusb>=1.3,<2", "libusb>=1.0.27,<2; sys_platform == 'win32'"]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "build"]

[project.scripts]
openrgb-display-control = "openrgb_display_control.cli:main"

[project.gui-scripts]
openrgb-display-control-gui = "openrgb_display_control.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openrgb_display_control = ["matrix_map.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
